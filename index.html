<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe6d8">
<title>Camila &amp; Juan · 08.12.2026</title>
<meta name="description" content="Camila & Juan · Nos casamos el 8 de diciembre de 2026. Abrí tu invitación.">
<link rel="preload" as="image" href="entrada/puerta-izq.webp?v=3791937381">
<link rel="preload" as="image" href="entrada/puerta-der.webp?v=3791937381">
<link rel="preload" as="image" href="entrada/cinta.webp?v=3791937381">
<link rel="prefetch" href="invitacion/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
<style>
  :root{--ivory:#efe6d8;--brown:#644732;--petroleum:#527987}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#efe0cc url('entrada/fondo.jpg?v=2791936969') center top/auto 100% repeat-x;overflow:hidden;font-family:Georgia,serif;color:var(--brown)}

  /* Escena con la proporción de los cuadros (1024x1536) */
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 0}
  .scene{--h:min(90svh,calc(92vw * 1340 / 788));position:relative;height:var(--h);aspect-ratio:788/1340;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent),linear-gradient(transparent,#000 1.5%,#000 98.5%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent),linear-gradient(transparent,#000 1.5%,#000 98.5%,transparent);mask-composite:intersect;border:0;padding:0;background:none;color:inherit;font:inherit;cursor:pointer;
    
    animation:llega 1.4s .15s cubic-bezier(.22,.61,.36,1) both}
  .scene:focus-visible{outline:none;filter:none}
  /* Carta: fondo abierto + dos puertas que giran en 3D + cinta que cae */
  .card{position:absolute;inset:0;perspective:1600px;transform-origin:50% 48%;transition:transform 1s cubic-bezier(.55,0,.25,1)}
  .card>img,.door{position:absolute;top:0;height:100%}
  .base{left:0;width:100%;opacity:0;transition:opacity .5s ease}
  .door{width:50%;background-size:cover;backface-visibility:hidden;transform-style:preserve-3d;will-change:transform;
    transition:transform 1.7s cubic-bezier(.65,0,.25,1),filter 1.7s ease}
  .door.izq{left:0;background-image:url('entrada/puerta-izq.webp?v=3791937381');transform-origin:4% 50%}
  .door.der{right:0;background-image:url('entrada/puerta-der.webp?v=3791937381');transform-origin:96% 50%}
  .cinta{left:0;width:100%;top:44.78%!important;height:49.25%!important;will-change:transform,opacity;transform-origin:50% 22%}

  .letter{position:absolute;left:8.5%;right:8.4%;top:4.6%;bottom:4.4%;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;opacity:0;transition:opacity 1.2s ease .5s}
  .letter .eyebrow{font-size:3.6cqw;letter-spacing:1.5cqw;text-transform:uppercase}
  .letter .names{width:88%;margin:3cqh 0 1.5cqh}
  .letter .line{width:60%;margin:1cqh 0 3cqh}
  .letter .date{font-size:8cqw;letter-spacing:1.6cqw}
  .letter .place{font-size:4.4cqw;margin-top:2.5cqh;font-style:italic}

  .playing .scene{cursor:default}
  /* 1) la cinta se suelta: sube apenas, gira y cae con gravedad */
  .playing .cinta{animation:cae 1.25s cubic-bezier(.45,.05,.75,.6) forwards}
  @keyframes cae{0%{transform:none;opacity:1}
    15%{transform:translateY(-1.5%) rotate(-1.5deg)}
    100%{transform:translateY(95%) translateX(4%) rotate(14deg);opacity:0}}
  /* 2) las puertas se abren */
  .abrir .base{opacity:1}
  .abrir .door.izq{transform:rotateY(-112deg);filter:brightness(.82)}
  .abrir .door.der{transform:rotateY(112deg);filter:brightness(.82)}
  .abrir .letter{opacity:1}
  /* 3) zoom a los nombres y fundido */
  .zoom .card{transform:scale(1.55)}
  .veil{position:fixed;inset:0;background:var(--ivory);opacity:0;pointer-events:none;transition:opacity .45s ease .45s}
  .zoom .veil{opacity:1}

  .inv-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--ivory);opacity:0;transition:opacity .3s}
  .inside .inv-frame{opacity:1}
  .inside .stage{visibility:hidden}
  @keyframes llega{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.scene{animation:none}.door,.card,.letter{transition:none!important}.playing .cinta{animation:none;opacity:0}}
</style>
</head>
<body>
<main class="stage">
  <button class="scene" id="scene" aria-label="Abrir la invitación de Camila y Juan">
    <span class="card" id="card" aria-hidden="true">
      <img class="base" src="entrada/abre-3.webp?v=3791937381" alt="">
      <span class="letter">
        <span class="eyebrow">Nos casamos</span>
        <img class="names" src="invitacion/assets/nombres.png" alt="">
        <img class="line" src="invitacion/assets/linea.png" alt="">
        <span class="date">08.12.2026</span>
        <span class="place">Palacio Sans Souci</span>
      </span>
      <span class="door izq"></span>
      <span class="door der"></span>
      <img class="cinta" src="entrada/cinta.webp?v=3791937381" alt="" fetchpriority="high">
    </span>
  </button>
</main>
<div class="veil" aria-hidden="true"></div>
<audio id="bg-music" src="invitacion/assets/musica.mp3" preload="auto" loop playsinline></audio>
<script>
  const DESTINO = 'invitacion/';
  const scene = document.getElementById('scene');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const imgs = ['entrada/puerta-izq.webp?v=3791937381','entrada/puerta-der.webp?v=3791937381','entrada/abre-3.webp?v=3791937381','entrada/cinta.webp?v=3791937381'];
  const listos = Promise.all(imgs.map(src => { const i = new Image(); i.src = src; return i.decode().catch(() => {}); }));
  const wait = ms => new Promise(r => setTimeout(r, ms));

  const music = document.getElementById('bg-music');
  // Si el invitado sale del navegador o cambia de app, la música se pausa; al volver, sigue.
  let pausadaPorSalir = false;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (!music.paused) { music.pause(); pausadaPorSalir = true; } }
    else if (pausadaPorSalir) { pausadaPorSalir = false; music.play().catch(() => {}); }
  });
  addEventListener('pagehide', () => music.pause());
  
  scene.addEventListener('click', async () => {
    if (document.body.classList.contains('playing')) return;
    // La música arranca con este toque (tiene que ser acá, dentro del toque).
    music.play().catch(() => {});
    document.body.classList.add('playing');
    await listos;
    await wait(reduce ? 0 : 650);          // la cinta empieza a caer
    document.body.classList.add('abrir');  // se abren las puertas
    await wait(reduce ? 400 : 2300);       // carta abierta, se ven los nombres
    document.body.classList.add('zoom');
    await wait(reduce ? 500 : 950);
    abrirInvitacion();
  });

  // La invitación se abre en esta misma página (sin navegar) para que la música no se corte.
  function abrirInvitacion() {
    const frame = document.createElement('iframe');
    frame.src = DESTINO;
    frame.title = 'Invitación de Camila y Juan';
    frame.className = 'inv-frame';
    frame.addEventListener('load', () => {
      document.body.classList.add('inside');
      try { frame.contentWindow.document.title && (document.title = frame.contentWindow.document.title); } catch (e) {}
    }, { once: true });
    document.body.append(frame);
    // Si el navegador no carga el iframe, vamos a la página igual.
    setTimeout(() => { if (!document.body.classList.contains('inside')) location.href = DESTINO; }, 6000);
  }
  // Si vuelven con "atrás", la tarjeta aparece cerrada de nuevo.
  addEventListener('pageshow', e => {
    if (!e.persisted) return;
    document.body.classList.remove('playing', 'abrir', 'zoom', 'inside');
    document.querySelector('.inv-frame')?.remove();
  });
</script>
</body>
</html>
