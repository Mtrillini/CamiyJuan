<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe6d8">
<title>Camila &amp; Juan · 08.12.2026</title>
<meta name="description" content="Camila & Juan · Nos casamos el 8 de diciembre de 2026. Abrí tu invitación.">
<link rel="preload" as="image" href="entrada/mono-0.webp?v=1791947115">
<link rel="preload" as="image" href="entrada/carta-abierta.webp?v=1791943797">
<link rel="preload" as="image" href="entrada/solapa-izquierda.webp?v=1791943797">
<link rel="preload" as="image" href="entrada/solapa-derecha.webp?v=1791943797">
<link rel="prefetch" href="invitacion/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
<style>
  :root{--ivory:#efe6d8;--brown:#644732;--petroleum:#527987}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#efe0cc url('entrada/fondo.jpg?v=1791943797') center top/auto 100% repeat-x;font-family:Georgia,serif;color:var(--brown)}
  .stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;padding:3vh 16px}

  /* Sobre: proporción de la carta (3/5), lo más grande que entre en pantalla */
  .sobre{position:relative;width:min(92vw,500px,calc(92svh * 3 / 5));aspect-ratio:3/5;perspective:1400px;isolation:isolate;
    filter:drop-shadow(0 18px 28px #5b402a2e);transform-origin:50% 45%;animation:llega 1.2s cubic-bezier(.22,.61,.36,1) both;
    transition:transform 1.2s cubic-bezier(.45,0,.2,1)}
  .invitacion{position:absolute;inset:0;background:url('entrada/carta-abierta.webp?v=1791943797') center/100% 100%;
    container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .invitacion>*{opacity:0;transition:opacity 1.2s ease}
  .invitacion .eyebrow{font-size:3.4cqw;letter-spacing:1.5cqw;text-transform:uppercase}
  .invitacion .names{width:80%;margin:3cqh 0 1.5cqh}
  .invitacion .line{width:56%;margin:1cqh 0 3cqh}
  .invitacion .date{font-size:7.6cqw;letter-spacing:1.6cqw}
  .invitacion .place{font-size:4.2cqw;margin-top:2.5cqh;font-style:italic}

  .solapa{position:absolute;top:0;width:50%;height:100%;z-index:2;backface-visibility:hidden;will-change:transform;
    transition:transform 2.2s cubic-bezier(.45,.05,.2,1) 3.4s,filter 2.2s ease 3.4s}
  .izquierda{left:0;transform-origin:left center}
  .derecha{right:0;transform-origin:right center}

  /* Cinta: video sin fondo (moño con lacre). Cuadro 720x406; el lacre está en (50%, 42%) */
  .cinta{position:absolute;top:30%;left:-40%;width:180%;aspect-ratio:800/450;z-index:3;padding:0;border:0;background:transparent;cursor:pointer;
    -webkit-tap-highlight-color:transparent;pointer-events:none;transition:opacity .7s cubic-bezier(.4,0,.2,1) 3.4s,transform .9s cubic-bezier(.4,0,.2,1) 3.3s}
  .cinta img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .cinta .hit{position:absolute;left:40%;top:22%;width:20%;height:55%;pointer-events:auto;border-radius:16px}
  .cinta:focus-visible .hit{outline:2px solid var(--petroleum);outline-offset:4px}
  .cinta:not(:disabled){animation:invita 2.6s ease-in-out 1.6s infinite}
  .sobre.abierto .cinta{opacity:0;animation:none;transform:translateY(-3%) scale(1.04)}
  .sobre.abierto .izquierda{transform:rotateY(-165deg);filter:brightness(.85)}
  .sobre.abierto .derecha{transform:rotateY(165deg);filter:brightness(.85)}
  .sobre.abierto .invitacion>*{opacity:1;transition-delay:4.5s}
  .sobre.zoom{transform:scale(1.5)}
  .veil{position:fixed;inset:0;background:var(--ivory);opacity:0;pointer-events:none;transition:opacity .45s ease .45s;z-index:5}
  .zoom~.veil,body.zoom .veil{opacity:1}

  @keyframes invita{0%,100%{transform:none}50%{transform:translateY(-3px)}}
  @keyframes llega{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .inv-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--ivory);opacity:0;transition:opacity .3s;z-index:6}
  .inside .inv-frame{opacity:1}
  .inside .stage{visibility:hidden}
  @media (prefers-reduced-motion:reduce){.solapa{transition:none!important}.sobre.abierto .cinta{animation:none;opacity:0}.sobre,.cinta{animation:none!important}}
</style>
</head>
<body>
<main class="stage">
  <div class="sobre" id="sobre">
    <div class="invitacion">
      <span class="eyebrow">Nos casamos</span>
      <img class="names" src="invitacion/assets/nombres.png" alt="Camila &amp; Juan">
      <img class="line" src="invitacion/assets/linea.png" alt="">
      <span class="date">08.12.2026</span>
      <span class="place">Palacio Sans Souci</span>
    </div>
    <img class="solapa izquierda" src="entrada/solapa-izquierda.webp?v=1791943797" alt="">
    <img class="solapa derecha" src="entrada/solapa-derecha.webp?v=1791943797" alt="">
    <button class="cinta" id="abrir" aria-label="Abrir invitación">
      <img id="mono" src="entrada/mono-0.webp?v=1791947115" alt="">
      <span class="hit"></span>
    </button>
  </div>
</main>
<div class="veil" aria-hidden="true"></div>
<audio id="bg-music" src="invitacion/assets/musica.mp3" preload="auto" loop playsinline></audio>
<script>
  const DESTINO = 'invitacion/';
  const sobre = document.getElementById('sobre');
  const abrir = document.getElementById('abrir');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const imgs = ['carta-abierta','solapa-izquierda','solapa-derecha'].map(n => 'entrada/' + n + '.webp?v=1791943797');
  const listos = Promise.all(imgs.map(src => { const i = new Image(); i.src = src; return i.decode().catch(() => {}); }));
  // El video del moño (animación con transparencia) se descarga antes y se arranca al tocar.
  const monoSrc = fetch('entrada/mono.webp?v=1791947606').then(r => r.blob()).then(b => URL.createObjectURL(b)).catch(() => null);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  const music = document.getElementById('bg-music');
  // Si el invitado sale del navegador o cambia de app, la música se pausa; al volver, sigue.
  let pausadaPorSalir = false;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (!music.paused) { music.pause(); pausadaPorSalir = true; } }
    else if (pausadaPorSalir) { pausadaPorSalir = false; music.play().catch(() => {}); }
  });
  addEventListener('pagehide', () => music.pause());
  
  abrir.addEventListener('click', async () => {
    if (abrir.disabled) return;
    abrir.disabled = true;
    music.play().catch(() => {});        // tiene que arrancar dentro del toque
    await listos;
    sobre.classList.add('abierto');       // corre el moño; después las solapas abren por CSS
    if (!reduce) {
      const src = await monoSrc;
      if (src) document.getElementById('mono').src = src;   // arranca la animación desde el primer cuadro
    }
    await wait(reduce ? 500 : 6100);      // ~3 s con el zoom: solapas abiertas, se ven los nombres
    sobre.classList.add('zoom'); document.body.classList.add('zoom');
    await wait(reduce ? 400 : 700);
    abrirInvitacion();
  });

  // La invitación se abre en esta misma página (sin navegar) para que la música no se corte.
  function abrirInvitacion() {
    const frame = document.createElement('iframe');
    frame.src = DESTINO;
    frame.title = 'Invitación de Camila y Juan';
    frame.className = 'inv-frame';
    frame.addEventListener('load', () => {
      document.body.classList.add('inside');
      try { frame.contentWindow.document.title && (document.title = frame.contentWindow.document.title); } catch (e) {}
    }, { once: true });
    document.body.append(frame);
    // Si el navegador no carga el iframe, vamos a la página igual.
    setTimeout(() => { if (!document.body.classList.contains('inside')) location.href = DESTINO; }, 6000);
  }
  // Si vuelven con "atrás", la tarjeta aparece cerrada de nuevo.
  addEventListener('pageshow', e => {
    if (!e.persisted) return;
    sobre.classList.remove('abierto', 'zoom'); document.body.classList.remove('zoom', 'inside');
    abrir.disabled = false; document.querySelector('.inv-frame')?.remove();
    document.getElementById('mono').src = 'entrada/mono-0.webp?v=1791947115';
  });
</script>
</body>
</html>
