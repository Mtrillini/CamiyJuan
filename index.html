<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe6d8">
<title>Camila &amp; Juan · 08.12.2026</title>
<meta name="description" content="Camila & Juan · Nos casamos el 8 de diciembre de 2026. Abrí tu invitación.">
<link rel="preload" as="image" href="entrada/cuadro-0.webp">
<link rel="prefetch" href="invitacion/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
<style>
  :root{--ivory:#efe6d8;--brown:#644732;--petroleum:#527987}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#ece3d3 url('entrada/fondo.jpg') center top/auto 100% repeat-x;overflow:hidden;font-family:Georgia,serif;color:var(--brown)}

  /* Escena con la proporción de los cuadros (1024x1536) */
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 0}
  .scene{--h:min(90svh,calc(92vw * 1340 / 788));position:relative;height:var(--h);aspect-ratio:788/1340;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent),linear-gradient(transparent,#000 1.5%,#000 98.5%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent),linear-gradient(transparent,#000 1.5%,#000 98.5%,transparent);mask-composite:intersect;border:0;padding:0;background:none;color:inherit;font:inherit;cursor:pointer;
    
    animation:llega 1.4s .15s cubic-bezier(.22,.61,.36,1) both}
  .scene:focus-visible{outline:none;filter:none}
  .frames{position:absolute;inset:0;transform-origin:50.8% 50.3%;transition:transform 1.5s cubic-bezier(.45,0,.55,1)}
  .frames>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s cubic-bezier(.45,0,.55,1)}
  .frames>img:first-child{opacity:1}
  .frames>img.on{opacity:1}

  /* La invitación dentro de la carta: ocupa el panel interior del último cuadro
     y se va descubriendo a medida que se abren las puertas. */
  .letter{position:absolute;left:8.5%;right:8.4%;top:4.6%;bottom:4.4%;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;opacity:0;clip-path:inset(0 50% 0 50%);transition:clip-path .2s cubic-bezier(.45,0,.55,1),opacity .2s}
  .letter[data-step="6"]{opacity:1;clip-path:inset(0 23% 0 23%)}
  .letter[data-step="7"]{opacity:1;clip-path:inset(0)}
  .letter .eyebrow{font-size:3.4cqw;letter-spacing:1.4cqw;text-transform:uppercase}
  .letter img{width:84%;margin:3cqh 0 2cqh}
  .letter .couple{width:78%;margin:2.5cqh 0 0;opacity:1;-webkit-mask-image:linear-gradient(#000 68%,transparent 98%);mask-image:linear-gradient(#000 68%,transparent 98%)}
  .letter .line{width:62%;margin:1cqh 0 3cqh}
  .letter .date{font-size:8cqw;letter-spacing:1.6cqw}
  .letter .place{font-size:4.4cqw;margin-top:2.5cqh;font-style:italic}

  .playing .scene{cursor:default}
  .playing .frames{transform:scale(1.03)}
  /* Al abrirse del todo: zoom a la invitación y fundido */
  .zoom .frames{transform-origin:50% 40%;transform:scale(1.5);transition:transform .6s cubic-bezier(.55,0,.25,1)}
  .veil{position:fixed;inset:0;background:var(--ivory);opacity:0;pointer-events:none;transition:opacity .35s ease .25s}
  .zoom .veil{opacity:1}

  .inv-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--ivory);opacity:0;transition:opacity .3s}
  .inside .inv-frame{opacity:1}
  .inside .stage{visibility:hidden}
  @keyframes llega{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.scene,.title{animation:none}.frames,.zoom .frames{transition:none;transform:none!important}}
</style>
</head>
<body>
<main class="stage">
  <button class="scene" id="scene" aria-label="Abrir la invitación de Camila y Juan">
    <span class="frames" id="frames" aria-hidden="true">
      <img src="entrada/cuadro-0.webp" alt="" fetchpriority="high">
      <img src="entrada/cuadro-1.webp" alt="">
      <img src="entrada/cuadro-2.webp" alt="">
      <img src="entrada/cuadro-3.webp" alt="">
      <img src="entrada/cuadro-4.webp" alt="">
      <img src="entrada/cuadro-5.webp" alt="">
      <img src="entrada/cuadro-6.webp" alt="">
      <img src="entrada/cuadro-7.webp" alt="">
      <span class="letter" id="letter">
        <span class="eyebrow">Nos casamos</span>
        <img class="couple" src="invitacion/assets/pareja.webp" alt="">
        <img class="line" src="invitacion/assets/linea.png" alt="">
        <span class="date">08.12.2026</span>
        <span class="place">Palacio Sans Souci</span>
      </span>
    </span>
  </button>
</main>
<div class="veil" aria-hidden="true"></div>
<audio id="bg-music" src="invitacion/assets/musica.mp3" preload="auto" loop playsinline></audio>
<script>
  const DESTINO = 'invitacion/';
  const PASO = 130;          // ms entre cuadros (el fundido dura .2s: se superponen)
  const scene = document.getElementById('scene');
  const letter = document.getElementById('letter');
  const frames = [...document.querySelectorAll('#frames > img')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Decodificamos todos los cuadros antes de animar para que no haya saltos.
  const listos = Promise.all([...document.images].map(img => img.decode().catch(() => {})));
  const wait = ms => new Promise(r => setTimeout(r, ms));

  const music = document.getElementById('bg-music');
  scene.addEventListener('click', async () => {
    if (document.body.classList.contains('playing')) return;
    // La música arranca con este toque (tiene que ser acá, dentro del toque).
    music.play().catch(() => {});
    document.body.classList.add('playing');
    await listos;
    if (reduce) { frames.at(-1).classList.add('on'); letter.dataset.step = frames.length - 1; await wait(600); }
    else for (let i = 1; i < frames.length; i++) {
      frames[i].classList.add('on');
      if (i >= 6) letter.dataset.step = i;
      await wait(PASO);
    }
    await wait(reduce ? 0 : 650);   // la carta queda abierta un momento, con la invitación a la vista
    document.body.classList.add('zoom');
    await wait(reduce ? 700 : 600);
    abrirInvitacion();
  });

  // La invitación se abre en esta misma página (sin navegar) para que la música no se corte.
  function abrirInvitacion() {
    const frame = document.createElement('iframe');
    frame.src = DESTINO;
    frame.title = 'Invitación de Camila y Juan';
    frame.className = 'inv-frame';
    frame.addEventListener('load', () => {
      document.body.classList.add('inside');
      try { frame.contentWindow.document.title && (document.title = frame.contentWindow.document.title); } catch (e) {}
    }, { once: true });
    document.body.append(frame);
    // Si el navegador no carga el iframe, vamos a la página igual.
    setTimeout(() => { if (!document.body.classList.contains('inside')) location.href = DESTINO; }, 6000);
  }
  // Si vuelven con "atrás", la tarjeta aparece cerrada de nuevo.
  addEventListener('pageshow', e => {
    if (!e.persisted) return;
    document.body.classList.remove('playing', 'zoom');
    frames.forEach(img => img.classList.remove('on'));
    delete letter.dataset.step;
  });
</script>
</body>
</html>
