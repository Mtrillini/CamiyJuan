<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camila &amp; Juan Â· 08.12.26</title>
<meta name="description" content="Save the date Â· Camila & Juan Â· 8 de diciembre de 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d4d3d1;
    --bg-soft: #d4d3d1;
    --ink: #111;
    --ink-soft: #3c3c3c;
    --line: rgba(255,255,255,.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
    display: flex; justify-content: center;
  }

  .card {
    position: relative;
    width: 100%; min-height: 100vh; min-height: 100svh;
    background: linear-gradient(180deg, #8f8d8a 0%, #b9b7b3 35%, var(--bg) 52%, var(--bg-soft) 100%);
    overflow: hidden;
    text-align: center;
  }

  /* Foto del palacio: poner fondo.jpg en la misma carpeta */
  .hero {
    position: absolute; inset: 0 0 auto 0; height: 62vh; min-height: 300px;
    background: url('fondo.webp') center 30% / cover no-repeat;
    filter: grayscale(1) contrast(1.05);
    -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 55%, transparent 100%);
    animation: zoom 18s ease-in-out infinite alternate;
  }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.08); } }

  /* Flores (recortes del save the date) */
  .flor { position: absolute; mix-blend-mode: multiply; opacity: 0; animation: florIn 2.5s 1s ease forwards;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 60%, transparent 100%);
            mask-image: radial-gradient(ellipse at center, #000 60%, transparent 100%); }
  .flor.f1 { width: clamp(140px, 24vw, 420px); left: 0; bottom: 0; }
  .flor.f2 { width: clamp(140px, 24vw, 420px); right: 0; bottom: 0; }
  @keyframes florIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }

  .content {
    position: relative; z-index: 2;
    padding: 33vh 16px 40px;
    display: flex; flex-direction: column; align-items: center;
  }
  .names { font-size: clamp(3.2rem, min(9vw, 13vh), 8.5rem) !important; }
  .countdown { margin-top: 24px !important; }
  .progress { margin-top: 24px !important; }
  .soon {
    display: inline-block; margin-top: 16px !important;
    padding: 8px 18px; border: 1px solid var(--ink);
    font-size: .78rem !important; color: var(--ink) !important;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .45; } }
  .std { width: min(820px, 92%) !important; }
  .date { font-size: clamp(2.6rem, min(7vw, 10vh), 6rem) !important; }

  /* Mobile */
  @media (max-width: 640px) {
    .hero { height: 46vh; background-position: center top; }
    .content { padding-top: 28vh; }
    .names { font-size: 15vw !important; }
    .std { letter-spacing: .3em; padding-left: .3em; }
    .date { font-size: 13vw !important; }
    .countdown { flex-wrap: wrap; justify-content: center; }
    .unit { min-width: 56px; }
    .flor { opacity: .7; }
  }

  .names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3.4rem, 13vw, 6.4rem);
    color: #fff;
    line-height: 1;
    text-shadow: 0 2px 6px rgba(0,0,0,.35);
    opacity: 0; animation: fadeUp 1.6s .3s ease forwards;
  }

  .std {
    width: min(560px, 92%);
    margin-top: 28px;
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    padding: 8px 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 3.6vw, 1.5rem);
    letter-spacing: .45em; padding-left: .45em;
    opacity: 0; animation: fadeUp 1.2s 1s ease forwards;
  }

  .date {
    display: flex; align-items: center; justify-content: center; gap: clamp(16px, 6vw, 48px);
    margin-top: 14px;
    font-family: 'Montserrat', sans-serif; font-weight: 400;
    font-size: clamp(2.8rem, 12vw, 4.6rem);
    opacity: 0; animation: fadeUp 1.2s 1.4s ease forwards;
  }
  .date .sep { width: 2px; height: .8em; background: var(--ink); }

  .place {
    margin-top: 10px;
    font-size: clamp(.8rem, 3.2vw, 1.05rem);
    letter-spacing: .04em;
    opacity: 0; animation: fadeUp 1.2s 1.8s ease forwards;
  }

  /* Cuenta regresiva */
  .countdown {
    display: flex; gap: clamp(10px, 4vw, 28px); margin-top: 40px;
    opacity: 0; animation: fadeUp 1.2s 2.2s ease forwards;
  }
  .unit { min-width: 64px; }
  .unit b {
    display: block;
    font-family: 'Cormorant Garamond', serif; font-weight: 500;
    font-size: clamp(1.8rem, 8vw, 2.6rem);
  }
  .unit span { font-size: .65rem; letter-spacing: .25em; text-transform: uppercase; color: var(--ink-soft); }

  /* En progreso */
  .progress {
    margin-top: 44px; width: min(380px, 85%);
    opacity: 0; animation: fadeUp 1.2s 2.6s ease forwards;
  }
  .progress p {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: clamp(1.05rem, 4vw, 1.3rem); color: var(--ink-soft);
    min-height: 1.6em;
    transition: opacity .6s ease;
  }
  .bar { position: relative; height: 1px; background: rgba(0,0,0,.2); margin-top: 14px; overflow: hidden; }
  .bar::after {
    content: ''; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
    background: var(--ink);
    animation: slide 2.8s ease-in-out infinite;
  }
  @keyframes slide { to { left: 100%; } }
  .soon {
    margin-top: 14px; font-size: .68rem; letter-spacing: .35em; text-transform: uppercase; color: var(--ink-soft);
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="hero" role="img" aria-label="Palacio"></div>

    <img class="flor f1" src="flor-izq.jpg" alt="">
    <img class="flor f2" src="flor-der.jpg" alt="">

    <section class="content">
      <h1 class="names">Camila &amp; Juan</h1>
      <div class="std">SAVE THE DATE</div>
      <div class="date">
        <span>08</span><i class="sep"></i><span>12</span><i class="sep"></i><span>26</span>
      </div>
      <p class="place">PAZ 705, VICTORIA, SAN FERNANDO</p>

      <div class="countdown" aria-label="Cuenta regresiva">
        <div class="unit"><b id="d">--</b><span>DÃ­as</span></div>
        <div class="unit"><b id="h">--</b><span>Horas</span></div>
        <div class="unit"><b id="m">--</b><span>Min</span></div>
        <div class="unit"><b id="s">--</b><span>Seg</span></div>
      </div>

      <div class="progress">
        <p id="msg">Estamos preparando algo especialâ€¦</p>
        <div class="bar"></div>
        <div class="soon">InvitaciÃ³n en camino</div>
      </div>
    </section>
  </main>

<script>
  // Fecha del evento (ajustar la hora cuando se confirme)
  const evento = new Date('2026-12-08T20:00:00-03:00');
  const pad = n => String(n).padStart(2, '0');

  function tick() {
    let diff = Math.max(0, evento - new Date());
    const d = Math.floor(diff / 864e5); diff %= 864e5;
    const h = Math.floor(diff / 36e5);  diff %= 36e5;
    const m = Math.floor(diff / 6e4);   diff %= 6e4;
    const s = Math.floor(diff / 1e3);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = pad(h);
    document.getElementById('m').textContent = pad(m);
    document.getElementById('s').textContent = pad(s);
  }
  tick(); setInterval(tick, 1000);

  const mensajes = [
    'Estamos preparando algo especialâ€¦',
    'Eligiendo cada detalle con amorâ€¦',
    'Muy pronto, toda la informaciÃ³nâ€¦',
    'ReservÃ¡ la fecha ðŸ’›'
  ];
  const msg = document.getElementById('msg');
  let i = 0;
  setInterval(() => {
    msg.style.opacity = 0;
    setTimeout(() => { i = (i + 1) % mensajes.length; msg.textContent = mensajes[i]; msg.style.opacity = 1; }, 600);
  }, 3500);
</script>
</body>
</html>
