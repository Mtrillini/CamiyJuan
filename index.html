<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe6d8">
<title>Camila &amp; Juan · 08.12.2026</title>
<meta name="description" content="Camila & Juan · Nos casamos el 8 de diciembre de 2026. Abrí tu invitación.">
<link rel="preload" as="image" href="entrada/tarjeta.jpg">
<link rel="prefetch" href="invitacion/">
<style>
  :root{--ivory:#efe6d8;--brown:#644732}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--ivory) url('invitacion/assets/fondo-mobile.jpg') center/cover fixed;overflow:hidden;font-family:Georgia,serif;color:var(--brown)}
  @media (min-aspect-ratio:1/1){body{background-image:url('invitacion/assets/fondo-web.jpg')}}

  .stage{height:100%;display:grid;place-items:center;perspective:2200px;padding:4vh 16px}
  /* La tarjeta mantiene la proporción de la imagen (770x1288) */
  .card{position:relative;height:min(88vh,calc((100vw - 32px) * 1288 / 770));aspect-ratio:770/1288;border:0;padding:0;background:none;cursor:pointer;
    filter:drop-shadow(0 18px 30px #5b402a33);transform-style:preserve-3d;animation:llega 1.1s cubic-bezier(.2,.7,.2,1) both}
  .card:focus-visible{outline:3px solid #527987;outline-offset:8px;border-radius:4px}
  /* Lo que aparece detrás al abrir */
  .inside{position:absolute;inset:0;background:#f7f1e6;display:grid;place-items:center;box-shadow:inset 0 0 40px #8a6a4a22;opacity:0}
  .inside img{width:70%}
  /* Las dos puertas: misma imagen, cada una muestra su mitad */
  .door{position:absolute;top:0;bottom:0;width:50%;background:url('entrada/tarjeta.jpg') no-repeat;background-size:200% 100%;backface-visibility:hidden;
    transition:transform 1.5s cubic-bezier(.6,.05,.25,1),filter 1.5s ease}
  .door.left{left:0;background-position:left center;transform-origin:left center}
  .door.right{right:0;background-position:right center;transform-origin:right center}
  .hint{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:12px;letter-spacing:4px;text-transform:uppercase;opacity:.75;animation:respira 2.4s ease-in-out infinite}

  /* Animación de apertura */
  .open .card{cursor:default;animation:none}
  .open .inside{opacity:1;transition:opacity .3s}
  .open .door.left{transform:rotateY(-108deg);filter:brightness(.9)}
  .open .door.right{transform:rotateY(108deg);filter:brightness(.9)}
  .open .hint{opacity:0;animation:none;transition:opacity .3s}
  .veil{position:fixed;inset:0;background:var(--ivory);opacity:0;pointer-events:none;transition:opacity .7s ease}
  .leaving .veil{opacity:1}
  .leaving .card{transform:scale(1.15);transition:transform .9s ease}

  @keyframes llega{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes respira{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.card,.hint{animation:none}.door{transition:opacity .6s}.open .door{transform:none;opacity:0}}
</style>
</head>
<body>
<main class="stage">
  <button class="card" id="card" aria-label="Abrir la invitación de Camila y Juan">
    <span class="inside" aria-hidden="true"><img src="invitacion/assets/nombres.png" alt=""></span>
    <span class="door left" aria-hidden="true"></span>
    <span class="door right" aria-hidden="true"></span>
    <span class="hint" aria-hidden="true">Tocá para abrir</span>
  </button>
</main>
<div class="veil" aria-hidden="true"></div>
<script>
  const DESTINO = 'invitacion/';
  const card = document.getElementById('card');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  card.addEventListener('click', () => {
    if (document.body.classList.contains('open')) return;
    document.body.classList.add('open');
    // Puertas abiertas → acercamiento y fundido → invitación
    setTimeout(() => document.body.classList.add('leaving'), reduce ? 400 : 1500);
    setTimeout(() => { location.href = DESTINO; }, reduce ? 900 : 2300);
  });
  // Si vuelven con "atrás", la tarjeta aparece cerrada de nuevo.
  addEventListener('pageshow', e => { if (e.persisted) document.body.classList.remove('open', 'leaving'); });
</script>
</body>
</html>
