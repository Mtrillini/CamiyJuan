<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe6d8">
<title>Camila &amp; Juan · 08.12.2026</title>
<meta name="description" content="Camila & Juan · Nos casamos el 8 de diciembre de 2026. Abrí tu invitación.">
<link rel="preload" as="image" href="entrada/cuadro-0.webp">
<link rel="prefetch" href="invitacion/">
<style>
  :root{--ivory:#efe6d8;--brown:#644732}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--ivory) url('invitacion/assets/fondo-mobile.jpg') center/cover fixed;overflow:hidden;font-family:Georgia,serif;color:var(--brown)}
  @media (min-aspect-ratio:1/1){body{background-image:url('invitacion/assets/fondo-web.jpg')}}

  /* Escenario con la proporción de los cuadros (1024x1536), lo más grande posible */
  .stage{position:fixed;inset:0;display:grid;place-items:center}
  .scene{position:relative;height:min(100vh,150vw);height:min(100svh,150vw);aspect-ratio:2/3;border:0;padding:0;background:none;cursor:pointer;
    -webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 72%,transparent 100%);
    animation:llega 1.4s cubic-bezier(.22,.61,.36,1) both}
  .scene:focus-visible{outline:none}
  .scene:focus-visible .hint{opacity:1}
  .frames{position:absolute;inset:0;transform-origin:50% 48%;transition:transform 4.6s cubic-bezier(.45,0,.55,1)}
  .frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .95s cubic-bezier(.45,0,.55,1)}
  .frames img.on{opacity:1}
  .frames img:first-child{opacity:1}
  .hint{position:fixed;left:0;right:0;bottom:max(4vh,18px);text-align:center;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--brown);animation:respira 2.6s ease-in-out infinite;transition:opacity .5s}

  .playing .scene{cursor:default}
  .playing .hint{opacity:0;animation:none}
  .playing .frames{transform:scale(1.035)}
  /* Final: la cámara entra por la abertura y se funde a marfil */
  .leaving .frames{transform:scale(2.3);transition:transform 1.6s cubic-bezier(.55,0,.35,1)}
  .veil{position:fixed;inset:0;background:var(--ivory);opacity:0;pointer-events:none;transition:opacity 1.1s ease .4s}
  .leaving .veil{opacity:1}

  @keyframes llega{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  @keyframes respira{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.scene,.hint{animation:none}.frames,.leaving .frames{transition:none;transform:none!important}}
</style>
</head>
<body>
<main class="stage">
  <button class="scene" id="scene" aria-label="Abrir la invitación de Camila y Juan">
    <span class="frames" id="frames" aria-hidden="true">
      <img src="entrada/cuadro-0.webp" alt="" fetchpriority="high">
      <img src="entrada/cuadro-1.webp" alt="" loading="eager">
      <img src="entrada/cuadro-2.webp" alt="" loading="eager">
      <img src="entrada/cuadro-3.webp" alt="" loading="eager">
      <img src="entrada/cuadro-4.webp" alt="" loading="eager">
      <img src="entrada/cuadro-5.webp" alt="" loading="eager">
      <img src="entrada/cuadro-6.webp" alt="" loading="eager">
    </span>
  </button>
  <p class="hint" aria-hidden="true">Tocá para abrir</p>
</main>
<div class="veil" aria-hidden="true"></div>
<script>
  const DESTINO = 'invitacion/';
  const PASO = 720;          // ms entre cuadro y cuadro (el fundido dura .95s, se superponen)
  const scene = document.getElementById('scene');
  const frames = [...document.querySelectorAll('#frames img')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Decodificamos todos los cuadros antes de animar para que no haya saltos.
  const listos = Promise.all(frames.map(img => img.decode().catch(() => {})));
  const wait = ms => new Promise(r => setTimeout(r, ms));

  scene.addEventListener('click', async () => {
    if (document.body.classList.contains('playing')) return;
    document.body.classList.add('playing');
    await listos;
    if (reduce) { frames.at(-1).classList.add('on'); await wait(500); }
    else for (const img of frames.slice(1)) { img.classList.add('on'); await wait(PASO); }
    await wait(reduce ? 0 : 450);
    document.body.classList.add('leaving');
    await wait(reduce ? 700 : 1500);
    location.href = DESTINO;
  });
  // Si vuelven con "atrás", la tarjeta aparece cerrada de nuevo.
  addEventListener('pageshow', e => {
    if (!e.persisted) return;
    document.body.classList.remove('playing', 'leaving');
    frames.forEach(img => img.classList.remove('on'));
  });
</script>
</body>
</html>
